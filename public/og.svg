<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F8F9FB"/>
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="#FFFFFF" stroke="#E3E5EA" stroke-width="2"/>
  
  <!-- Subtle Gradient Glow -->
  <circle cx="280" cy="300" r="220" fill="#FF7BA3" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="920" cy="320" r="220" fill="#5FA0FF" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Logo -->
  <text x="80" y="110" font-family="Pretendard, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#17181C" letter-spacing="-0.04em">angie</text>
  <circle cx="212" cy="84" r="7" fill="#FF7BA3"/>
  <circle cx="230" cy="84" r="7" fill="#5FA0FF"/>

  <!-- Tagline -->
  <text x="80" y="220" font-family="Pretendard, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#17181C" letter-spacing="-0.03em">
