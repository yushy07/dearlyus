  </text>

  <!-- Photostrip Card Representation -->
  <g transform="translate(860, 80) rotate(5)">
    <rect width="220" height="460" rx="6" fill="#FFFFFF" stroke="#D8DBE2" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.1))"/>
    <text x="110" y="28" font-family="monospace" font-weight="700" font-size="10" fill="#8E929E" text-anchor="middle" letter-spacing="0.2em">ANGIE · 인생네컷</text>
    
    <rect x="18" y="40" width="184" height="85" rx="3" fill="#FFEBF1"/>
    <circle cx="110" cy="82" r="22" fill="#FF7BA3"/>
    
    <rect x="18" y="135" width="184" height="85" rx="3" fill="#EBF3FF"/>
    <circle cx="110" cy="177" r="22" fill="#5FA0FF"/>
    
    <rect x="18" y="230" width="184" height="85" rx="3" fill="#FFEBF1"/>
    <text x="110" y="278" font-family="sans-serif" font-size="28" text-anchor="middle">💖</text>
    
    <rect x="18" y="325" width="184" height="85" rx="3" fill="#EBF3FF"/>
    <text x="110" y="373" font-family="sans-serif" font-size="28" text-anchor="middle">🫰</text>
    
    <text x="110" y="435" font-family="sans-serif" font-weight="800" font-size="12" fill="#17181C" text-anchor="middle">MIA ♡ ALEX</text>
