<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Left Ribbon Gradient (Rose Coral to Sunset Magenta) -->
    <linearGradient id="fav-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="60%" stop-color="#FF4E78"/>
      <stop offset="100%" stop-color="#D91E52"/>
    </linearGradient>

    <!-- Right Ribbon Gradient (Twilight Cerulean to Deep Indigo) -->
    <linearGradient id="fav-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#437EEB"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Center Blend Glow -->
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="fav-sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Badge (Velvet Plum Obsidian Squircle) -->
  <rect width="128" height="128" rx="36" fill="#1C1924"/>
  <rect width="126" height="126" x="1" y="1" rx="35" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#fav-glow)" opacity="0.35"/>

  <!-- Left Partner Loop (Rose Infinity Ribbon) -->
  <path d="M64 77 C51 93 29 86 29 64 C29 45 48 38 64 58" 
        stroke="url(#fav-rose)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Right Partner Loop (Cerulean Infinity Ribbon) -->
  <path d="M64 58 C80 38 99 45 99 64 C99 86 77 93 64 77" 
        stroke="url(#fav-blue)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Central Luminous Sparkle Star -->
  <circle cx="64" cy="67" r="5.5" fill="#FFFFFF" filter="url(#fav-sparkle)"/>
  <path d="M64 57 L66 64.5 L74 67 L66 69.5 L64 77 L62 69.5 L54 67 L62 64.5 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
</svg>
