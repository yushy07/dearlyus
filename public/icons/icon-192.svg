<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <defs>
    <linearGradient id="pwa-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="60%" stop-color="#FF4E78"/>
      <stop offset="100%" stop-color="#D91E52"/>
    </linearGradient>
    <linearGradient id="pwa-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#437EEB"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="pwa-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="pwa-sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="54" fill="#1C1924"/>
  <rect width="190" height="190" x="1" y="1" rx="53" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <circle cx="96" cy="96" r="66" fill="url(#pwa-glow)" opacity="0.35"/>

  <!-- Left Loop -->
  <path d="M96 115 C76 140 43 130 43 96 C43 68 72 58 96 87" 
        stroke="url(#pwa-rose)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Right Loop -->
  <path d="M96 87 C120 58 149 68 149 96 C149 130 116 140 96 115" 
        stroke="url(#pwa-blue)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Sparkle Star -->
  <circle cx="96" cy="100" r="8" fill="#FFFFFF" filter="url(#pwa-sparkle)"/>
  <path d="M96 85 L99 96 L108 100 L99 104 L96 115 L93 104 L84 100 L93 96 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
</svg>
