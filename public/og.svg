  <text x="170" y="508" font-family="Pretendard, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle">Play Free Online ▷</text>
  
  <text x="280" y="508" font-family="monospace" font-weight="700" font-size="14" fill="#8E929E">getangie.com · no app required</text>
